<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YT-DLP Importer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="app-header">
        <h1>YT-DLP Importer</h1>
        <span id="status-dot" class="dot dot-idle" title="Estado"></span>
    </header>

    <!-- ===================== CONFIGURACIÓN ===================== -->
    <details id="config-section" class="config">
        <summary>Configuración</summary>
        <div class="config-body">

            <div class="field">
                <label for="cfg-ytdlp">Ejecutable yt-dlp</label>
                <input id="cfg-ytdlp" type="text" spellcheck="false"
                       placeholder="C:\Tools\yt-dlp.exe  (o simplemente: yt-dlp)">
            </div>

            <div class="field">
                <label for="cfg-ffmpeg">Ejecutable ffmpeg</label>
                <input id="cfg-ffmpeg" type="text" spellcheck="false"
                       placeholder="C:\Tools\ffmpeg\bin\ffmpeg.exe  (o su carpeta)">
            </div>

            <div class="field">
                <label for="cfg-dest">Carpeta de descargas</label>
                <input id="cfg-dest" type="text" spellcheck="false"
                       placeholder="C:\Users\tuUsuario\Videos\Descargas">
            </div>

            <button id="btn-save-config" class="btn btn-secondary">Guardar configuración</button>
            <p id="config-feedback" class="hint"></p>
        </div>
    </details>

    <div id="config-warning" class="warning hidden">
        Faltan rutas por configurar. Completa la sección
        <strong>Configuración</strong> para habilitar la descarga.
    </div>

    <!-- ===================== DESCARGA ===================== -->
    <section class="main">
        <input id="url" type="text" spellcheck="false"
               placeholder="https://www.youtube.com/watch?v=...">

        <!-- ===================== TRIMMER ===================== -->
        <section id="trim-card" class="trim-card hidden">
            <div class="trim-head">
                <div id="trim-title" class="trim-title">Analizando…</div>
                <div id="trim-duration" class="trim-duration"></div>
            </div>
            <div class="trim-canvas-wrap">
                <canvas id="trim-canvas"></canvas>
                <div id="trim-hover" class="trim-hover hidden">
                    <canvas id="trim-hover-img" width="84" height="47"></canvas>
                    <div id="trim-hover-time" class="trim-hover-time">0:00</div>
                </div>
                <div id="trim-loading" class="trim-loading">Obteniendo info del video…</div>
            </div>
            <div class="trim-controls">
                <label class="radio">
                    <input type="checkbox" id="chk-trim">
                    <span>Recortar</span>
                </label>
                <input id="trim-start" type="text" class="time-input" spellcheck="false" disabled>
                <span class="trim-sep">→</span>
                <input id="trim-end" type="text" class="time-input" spellcheck="false" disabled>
                <button id="btn-trim-reset" class="btn-mini" disabled>Todo</button>
            </div>
        </section>

        <div class="format-row" role="radiogroup">
            <label class="radio">
                <input type="radio" name="format" value="video" checked>
                <span>Video (MP4)</span>
            </label>
            <label class="radio">
                <input type="radio" name="format" value="audio">
                <span>Solo audio (MP3)</span>
            </label>
        </div>

        <div class="quality-row">
            <div class="field" id="field-vq">
                <label for="sel-vq">Calidad de video</label>
                <select id="sel-vq">
                    <option value="best" selected>Mejor disponible</option>
                    <option value="2160">4K · 2160p</option>
                    <option value="1440">QHD · 1440p</option>
                    <option value="1080">Full HD · 1080p</option>
                    <option value="720">HD · 720p</option>
                    <option value="480">SD · 480p</option>
                    <option value="360">360p</option>
                </select>
            </div>
            <div class="field hidden" id="field-aq">
                <label for="sel-aq">Bitrate de audio</label>
                <select id="sel-aq">
                    <option value="0" selected>Mejor (VBR)</option>
                    <option value="320K">320 kbps</option>
                    <option value="256K">256 kbps</option>
                    <option value="192K">192 kbps</option>
                    <option value="128K">128 kbps</option>
                    <option value="96K">96 kbps</option>
                </select>
            </div>
        </div>

        <button id="btn-download" class="btn btn-primary" disabled>
            Descargar e Importar
        </button>

        <div class="progress-wrap">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0%</div>
    </section>

    <!-- ===================== LOG ===================== -->
    <section class="log-wrap">
        <div class="log-title">Estado</div>
        <div id="log" class="log"></div>
    </section>

    <script src="../js/CSInterface.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
