<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YT-DLP Importer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="app-header">
        <h1>YT-DLP Importer</h1>
        <span id="status-dot" class="dot dot-idle" title="Status" data-i18n-title="ui.state"></span>
    </header>

    <!-- ===================== CONFIGURACIÓN ===================== -->
    <details id="config-section" class="config">
        <summary data-i18n="ui.config">Settings</summary>
        <div class="config-body">

            <div class="field">
                <label for="cfg-ytdlp" data-i18n="ui.cfgYtdlp">yt-dlp executable</label>
                <input id="cfg-ytdlp" type="text" spellcheck="false"
                       placeholder="C:\Tools\yt-dlp.exe">
            </div>

            <div class="field">
                <label for="cfg-ffmpeg" data-i18n="ui.cfgFfmpeg">ffmpeg executable</label>
                <input id="cfg-ffmpeg" type="text" spellcheck="false"
                       placeholder="C:\Tools\ffmpeg\bin\ffmpeg.exe">
            </div>

            <div class="field">
                <label for="cfg-dest" data-i18n="ui.cfgDest">Downloads folder</label>
                <input id="cfg-dest" type="text" spellcheck="false"
                       placeholder="C:\Users\you\Videos">
            </div>

            <button id="btn-save-config" class="btn btn-secondary" data-i18n="ui.cfgSave">Save settings</button>
            <p id="config-feedback" class="hint"></p>
        </div>
    </details>

    <div id="config-warning" class="warning hidden"></div>

    <!-- ===================== DESCARGA ===================== -->
    <section class="main">
        <input id="url" type="text" spellcheck="false"
               placeholder="https://www.youtube.com/watch?v=...">

        <!-- ===================== TRIMMER ===================== -->
        <section id="trim-card" class="trim-card hidden">
            <div class="trim-head">
                <div id="trim-title" class="trim-title">Analizando…</div>
                <div id="trim-duration" class="trim-duration"></div>
            </div>
            <div class="trim-canvas-wrap">
                <canvas id="trim-canvas"></canvas>
                <div id="trim-loading" class="trim-loading">Obteniendo info del video…</div>
            </div>
            <div class="trim-controls">
                <label class="radio">
                    <input type="checkbox" id="chk-trim">
                    <span data-i18n="ui.trim">Trim</span>
                </label>
                <input id="trim-start" type="text" class="time-input" spellcheck="false" disabled>
                <span class="trim-sep">→</span>
                <input id="trim-end" type="text" class="time-input" spellcheck="false" disabled>
                <button id="btn-trim-reset" class="btn-mini" data-i18n="ui.trimAll" disabled>All</button>
            </div>
        </section>

        <div class="format-row" role="radiogroup">
            <label class="radio">
                <input type="radio" name="format" value="video" checked>
                <span data-i18n="ui.fmtVideo">Video (MP4)</span>
            </label>
            <label class="radio">
                <input type="radio" name="format" value="audio">
                <span data-i18n="ui.fmtAudio">Audio only (MP3)</span>
            </label>
        </div>

        <div class="quality-row">
            <div class="field" id="field-vq">
                <label for="sel-vq" data-i18n="ui.vqLabel">Video quality</label>
                <select id="sel-vq">
                    <option value="best" selected data-i18n="ui.vqBest">Best available</option>
                    <option value="2160">4K · 2160p</option>
                    <option value="1440">QHD · 1440p</option>
                    <option value="1080">Full HD · 1080p</option>
                    <option value="720">HD · 720p</option>
                    <option value="480">SD · 480p</option>
                    <option value="360">360p</option>
                </select>
            </div>
            <div class="field hidden" id="field-aq">
                <label for="sel-aq" data-i18n="ui.aqLabel">Audio bitrate</label>
                <select id="sel-aq">
                    <option value="0" selected data-i18n="ui.aqBest">Best (VBR)</option>
                    <option value="320K">320 kbps</option>
                    <option value="256K">256 kbps</option>
                    <option value="192K">192 kbps</option>
                    <option value="128K">128 kbps</option>
                    <option value="96K">96 kbps</option>
                </select>
            </div>
        </div>

        <button id="btn-download" class="btn btn-primary" data-i18n="ui.btnDownload" disabled>
            Download &amp; Import
        </button>

        <div class="progress-wrap">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0%</div>
    </section>

    <!-- ===================== LOG ===================== -->
    <details id="log-details" class="log-wrap">
        <summary class="log-title">
            <span data-i18n="ui.status">Log</span>
            <span id="log-last" class="log-last"></span>
        </summary>
        <div id="log" class="log"></div>
    </details>

    <script src="../js/CSInterface.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
